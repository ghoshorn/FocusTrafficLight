name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build unsigned app
        run: |
          xcodegen generate
          xcodebuild \
            -project FocusTrafficLight.xcodeproj \
            -scheme FocusTrafficLight \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned FocusTrafficLight.app
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          cp -R "$APP_PATH" .
          ditto -c -k --sequesterRsrc --keepParent "$(basename "$APP_PATH")" FocusTrafficLight.zip

      - name: Publish release with build
        uses: softprops/action-gh-release@v2
        with:
          files: FocusTrafficLight.zip
          generate_release_notes: true
          draft: false
          prerelease: false
